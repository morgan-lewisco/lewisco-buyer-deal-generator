<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Gold ring -->
  <circle cx="16" cy="16" r="15.5" fill="url(#ring)"/>
  <!-- Green background -->
  <circle cx="16" cy="16" r="13.5" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <ellipse cx="16" cy="10" rx="9" ry="6" fill="url(#shine)"/>
  <!-- Dollar sign -->
  <text x="16" y="22" font-size="19" font-family="Georgia, serif" font-weight="bold" fill="white" text-anchor="middle" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.4))">$</text>
</svg>
